appId: ${APP_ID}
name: Native cold start and navigation offline
tags:
  - mobile
  - offline
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: native-feed-scroll
    timeout: 30000
- tapOn: "^Menu$"
- extendedWaitUntil:
    visible:
      id: native-menu
    timeout: 30000
- openLink: wildloop://record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-offline-record
