appId: ${APP_ID}
name: Native cold start and navigation offline
tags:
  - mobile
  - offline
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: native-feed-scroll
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: craft-tab-/menu
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "^Menu$"
- extendedWaitUntil:
    visible:
      id: native-menu
    timeout: 30000
- openLink: wildloop://record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
# Signed out, a link to Record lands on the sign-in form - drawn from the
# bundle with no network, before any location prompt.
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-offline-record-sign-in
