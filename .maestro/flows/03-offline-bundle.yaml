appId: ${APP_ID}
name: Native cold start offline
tags:
  - mobile
  - offline
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
# The account gate is drawn from the bundle with no network: a fresh install
# offline opens on Login, not a blank screen or a spinner.
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible:
    id: craft-tab-/menu
- takeScreenshot: native-offline-login
- openLink: wildloop://record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
# Signed out, a link to Record lands on the sign-in form - drawn from the
# bundle with no network, before any location prompt.
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-offline-record-sign-in
