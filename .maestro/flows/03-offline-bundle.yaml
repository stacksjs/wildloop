appId: ${APP_ID}
name: Bundled cold start with offline enforcement
tags:
  - mobile
  - offline
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
    permissions:
      all: allow
# The app opens on the Feed. The landing page hands a native shell straight
# to /feed (index.stx), so its hero is never on screen long enough to assert;
# waiting for it passed or failed on timing.
- extendedWaitUntil:
    visible: Runs, kudos and turf changing hands.
    timeout: 90000
# Record through its deep link: a guest has no tab bar (c3e28d79). What this
# proves is unchanged, that a second bundled page loads with the network off.
- openLink: wildloop://record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible: "Close a loop.*"
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: offline-bundle
