appId: ${APP_ID}
name: Bundled cold start with offline enforcement
tags:
  - mobile
  - offline
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
    permissions:
      all: allow
- setLocation:
    latitude: 37.7749
    longitude: -122.4194
- extendedWaitUntil:
    visible: "Find your next adventure"
    timeout: 30000
- tapOn: "^Record$"
- assertVisible: "Close a loop.*"
- assertNotVisible: "would like to use your current location"
- tapOn: Allow precise location
- extendedWaitUntil:
    visible: Location ready
    timeout: 30000
- takeScreenshot: offline-bundle
