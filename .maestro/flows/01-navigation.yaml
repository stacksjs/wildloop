appId: ${APP_ID}
name: Native shell navigation
tags:
  - mobile
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# The app opens on the Feed. The landing page hands a native shell straight
# to /feed (index.stx), so its hero is never on screen long enough to assert;
# waiting for it passed or failed on timing.
- extendedWaitUntil:
    visible: Runs, kudos and turf changing hands.
    timeout: 30000
- takeScreenshot: launch
- tapOn: "^Feed$"
- extendedWaitUntil:
    visible: Log activity
    timeout: 30000
- takeScreenshot: feed
- tapOn: "^Trails$"
- extendedWaitUntil:
    visible: Every trail we know
    timeout: 30000
- takeScreenshot: trails
- tapOn: "^Record$"
- extendedWaitUntil:
    visible: "Close a loop.*"
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Start recording
    enabled: true
- tapOn: Start recording
# Signed out, the press opens the sign-in sheet (useRecorder's requireAuth)
# and replays once there is a session; the sheet is closed to go on.
- assertVisible: Sign in to record your run.
- takeScreenshot: signed-out-recording-gate
- tapOn: Close
# Territory, Profile and the rest live behind the Menu tab.
- tapOn: "^Menu$"
- extendedWaitUntil:
    visible: Log in or create an account
    timeout: 30000
- takeScreenshot: menu
- tapOn: "^Territory$"
- extendedWaitUntil:
    visible: Your territory map
    timeout: 30000
- takeScreenshot: territory
- tapOn: "^Menu$"
- tapOn: Log in or create an account
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- takeScreenshot: sign-in
