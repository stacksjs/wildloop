appId: ${APP_ID}
name: Native shell navigation
tags:
  - mobile
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Find your next adventure"
    timeout: 30000
- takeScreenshot: home
- tapOn: "^Feed$"
- extendedWaitUntil:
    visible: Log activity
    timeout: 30000
- takeScreenshot: feed
- tapOn: "^Trails$"
- extendedWaitUntil:
    visible: Every trail we know
    timeout: 30000
- takeScreenshot: trails
- tapOn: "^Record$"
- extendedWaitUntil:
    visible: "Close a loop.*"
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- tapOn: Allow precise location
- extendedWaitUntil:
    visible: Location ready
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Start recording
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Start recording
    enabled: true
- tapOn: Start recording
- assertVisible: Sign in before recording an activity.
- takeScreenshot: record
- tapOn: "^Territory$"
- extendedWaitUntil:
    visible: Your territory map
    timeout: 30000
- takeScreenshot: territory
- tapOn: "^Profile$"
- extendedWaitUntil:
    visible: Activities
    timeout: 30000
- takeScreenshot: profile
- tapOn: "^Settings$"
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 30000
- takeScreenshot: sign-in
