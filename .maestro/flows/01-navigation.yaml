appId: ${APP_ID}
name: Craft native account gate
tags:
  - mobile
  - smoke
---
# An account is required to use the app (requireNativeAccount in
# resources/functions/native-session.ts): a fresh install opens on Login,
# with no tab bar and no public feed drawn behind it.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible:
    id: native-feed-scroll
- assertNotVisible:
    id: craft-tab-/menu
- takeScreenshot: native-login-gate
# A link past the gate meets it too: the trails list a shortcut or a
# universal link opens asks for the account before it draws.
- openLink: wildloop://trails
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible:
    id: trails-scroll
- takeScreenshot: native-trails-link-gate
# So does Record, before any location prompt: the hidden Record tab no
# longer asks where the phone is.
- openLink: wildloop://record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-record-sign-in
# Signing up is the way in, and the gate offers it.
- tapOn: "Create an account"
- extendedWaitUntil:
    visible:
      id: register-email
    timeout: 30000
- takeScreenshot: native-register
