appId: ${APP_ID}
name: Craft native navigation
tags:
  - mobile
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: native-feed-scroll
    timeout: 30000
- takeScreenshot: native-feed
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: craft-tab-/menu
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "^Menu$"
- extendedWaitUntil:
    visible:
      id: native-menu
    timeout: 30000
- tapOn:
    id: menu-trails
- extendedWaitUntil:
    visible:
      id: trails-scroll
    timeout: 30000
- takeScreenshot: native-trails
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: craft-tab-/record
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "^Record$"
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-record
