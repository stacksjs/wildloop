appId: ${APP_ID}
name: Native recording account and checkpoint recovery
tags:
  - ios
  - local-server
  - mobile
---
- launchApp:
    clearState: true
# A fresh install opens on the account gate.
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- openLink: wildloop://login?next=/record
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- tapOn:
    id: login-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: login-password
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- tapOn:
    id: record-start
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      visible: "Allow Once"
    commands:
      - tapOn: "Allow Once"
- extendedWaitUntil:
    visible: "^Pause$"
    timeout: 30000
- setLocation:
    latitude: 37.7752
    longitude: -122.4194
- tapOn:
    id: record-pause
- extendedWaitUntil:
    visible: "^Resume$"
    timeout: 30000
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "^Resume$"
    timeout: 30000
- stopApp
- launchApp
- openLink: wildloop://record
- extendedWaitUntil:
    visible: "Your recording has been recovered from this device."
    timeout: 30000
- assertVisible: "^Resume$"
- takeScreenshot: native-recording-recovered
- tapOn:
    id: record-pause
- extendedWaitUntil:
    visible: "^Pause$"
    timeout: 30000
- setLocation:
    latitude: 37.7755
    longitude: -122.4194
- tapOn:
    id: record-finish
- extendedWaitUntil:
    visible: "Edit activity"
    timeout: 30000
- takeScreenshot: native-recording-saved
