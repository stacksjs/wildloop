appId: ${APP_ID}
name: Native record deep link
tags:
  - deep-link
  - mobile
---
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: record-start
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-deep-link
