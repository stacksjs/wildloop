appId: ${APP_ID}
name: Native record deep link
tags:
  - deep-link
  - mobile
---
# The link reaches Record, which asks a signed-out viewer to sign in first.
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- assertNotVisible: "would like to use your current location"
- takeScreenshot: native-deep-link
