appId: ${APP_ID}
name: Copy the trail link and paste it into a real native field
---
- launchApp
- openLink: wildloop://trail/${TRAIL_ID}
- extendedWaitUntil:
    visible:
      id: trail-share
    timeout: 30000
- tapOn:
    id: trail-share
- extendedWaitUntil:
    visible: '^Copy$'
    timeout: 15000
- takeScreenshot: android-native-share-sheet
- tapOn: '^Copy$'
- openLink: wildloop://search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- longPressOn:
    id: search-input
- tapOn: '^Paste$'
- assertVisible:
    id: search-input
    text: 'https://wildloop.org/trail/${TRAIL_ID}'
- takeScreenshot: android-native-share-link-pasted
