name: Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      - 'bun.lock'
      - 'resources/**'
      - 'storage/framework/defaults/resources/components/Native*.stx'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      - 'bun.lock'
      - 'resources/**'
      - 'storage/framework/defaults/resources/components/Native*.stx'
      - '.github/workflows/mobile.yml'

jobs:
  source-projects:
    env:
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      CRAFT_REVISION: 26d927f7f927e4db2c85c3df89368d3f3b745dba
      STX_REVISION: fa6f59b2bf0cfa599014b3a80f2cb119b3a69504
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
        with:
          gradle-version: '8.11.1'
      - name: Install XcodeGen
        if: matrix.platform == 'ios'
        run: brew install xcodegen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checkout STX
        uses: actions/checkout@v5
        with:
          repository: stacksjs/stx
          ref: ${{ env.STX_REVISION }}
          path: .stx-source
      - name: Build shared STX application
        env:
          STX_SOURCE_ROOT: ${{ github.workspace }}/.stx-source
        run: bun run build
      - name: Checkout Craft
        uses: actions/checkout@v5
        with:
          repository: craft-native/craft
          ref: ${{ env.CRAFT_REVISION }}
          path: .craft
      - name: Configure Firebase
        if: matrix.platform == 'android' && env.ANDROID_GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ env.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p .mobile-secrets
          printf '%s' "$GOOGLE_SERVICES_JSON" > .mobile-secrets/google-services.json
          echo "ANDROID_GOOGLE_SERVICES_FILE=$PWD/.mobile-secrets/google-services.json" >> "$GITHUB_ENV"
      - name: Generate iOS project
        if: matrix.platform == 'ios'
        run: CRAFT_IOS_SRC="$PWD/.craft/packages/ios/src/index.ts" bun run build:ios
      - name: Parse generated Swift
        if: matrix.platform == 'ios'
        run: find storage/framework/mobile/ios -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Compile iOS simulator app
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/WildLoop.xcodeproj -scheme WildLoop -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone release app
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/WildLoop.xcodeproj -scheme WildLoop -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Compile watchOS simulator companion
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/WildLoop.xcodeproj -target WildLoopWatch -sdk watchsimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Generate Android project
        if: matrix.platform == 'android'
        run: CRAFT_ANDROID_SRC="$PWD/.craft/packages/android/src/index.ts" bun run build:android
      - name: Compile Android release app
        if: matrix.platform == 'android'
        working-directory: storage/framework/mobile/android
        run: ./gradlew assembleRelease
      - name: Verify provenance
        run: bun -e "const manifest = JSON.parse(await Bun.file('storage/framework/mobile/${{ matrix.platform }}/stacks-mobile.json').text()); if (manifest.builder?.revision !== process.env.CRAFT_REVISION) throw new Error('Craft revision mismatch')"
