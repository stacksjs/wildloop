name: Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      # The app icon config/mobile.ts points at; a bad one fails the iOS build.
      - 'public/images/app/**'
      - 'package.json'
      - 'bun.lock'
      - 'resources/**'
      - 'scripts/**'
      - 'storage/framework/defaults/resources/components/Native*.stx'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/mobile.ts'
      # The app icon config/mobile.ts points at; a bad one fails the iOS build.
      - 'public/images/app/**'
      - 'package.json'
      - 'bun.lock'
      - 'resources/**'
      - 'scripts/**'
      - 'storage/framework/defaults/resources/components/Native*.stx'
      - '.github/workflows/mobile.yml'

jobs:
  source-projects:
    env:
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Install the published SDK compile platform
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Pantry
        if: matrix.platform == 'ios'
        uses: pantry-pm/pantry/packages/action@da17bb9317e8f8c247618fb176fe97269f15bfe4 # v0.11.94
        with:
          version: '0.11.94'
          install: 'false'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install iOS toolchain
        if: matrix.platform == 'ios'
        run: ./buddy setup:ios
      - name: Configure Firebase
        if: matrix.platform == 'android' && env.ANDROID_GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ env.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p .mobile-secrets
          printf '%s' "$GOOGLE_SERVICES_JSON" > .mobile-secrets/google-services.json
          echo "ANDROID_GOOGLE_SERVICES_FILE=$PWD/.mobile-secrets/google-services.json" >> "$GITHUB_ENV"
      - name: Generate iOS project
        if: matrix.platform == 'ios'
        run: bun run build:ios
      - name: Parse generated Swift
        if: matrix.platform == 'ios'
        run: find storage/framework/mobile/ios -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
      - name: Compile iOS simulator app
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/Wildloop.xcodeproj -scheme Wildloop -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone release app
        if: matrix.platform == 'ios'
        run: xcodebuild -project storage/framework/mobile/ios/Wildloop.xcodeproj -scheme Wildloop -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Generate Android project
        if: matrix.platform == 'android'
        run: bun run build:android
      - name: Compile Android release app
        if: matrix.platform == 'android'
        working-directory: storage/framework/mobile/android
        run: ./gradlew assembleRelease
      - name: Verify provenance
        run: bun -e "const manifest = JSON.parse(await Bun.file('storage/framework/mobile/${{ matrix.platform }}/stacks-mobile.json').text()); if (manifest.builder?.source !== 'package') throw new Error('Expected the frozen published Craft SDK')"
