name: Deploy

# Push to deploy.
#
# Gated on CI rather than firing on the push itself: `buddy deploy` activates a
# release atomically, so the failure mode of deploying an untested commit is a
# live site running it, not a red check somebody notices later.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Ship a specific commit without pushing, and reach environments that no
  # branch maps to.
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [production, staging, development]
        default: production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  # Never cancel a deploy in flight. Half of one is a release uploaded but not
  # activated, or services restarted against the previous release's env.
  cancel-in-progress: false

jobs:
  # Is the commit CI passed still the tip of main?
  #
  # Deploys queue one at a time, and each checks out the commit its CI run
  # was for. CI runs are not ordered: when two pushes land close together the
  # older one can finish CI last, and its deploy then replaces the newer
  # release. On 2026-09-24 a teammate's commit (b29ef136) deployed at 16:01
  # over the one after it (7e910024), taking the new trail filters off the
  # site with both deploys green. Checked here, when the deploy's turn comes:
  # if main has moved on, the newer commit's own CI run deploys it.
  current:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tip.outputs.latest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${SHA:0:8}: main is at ${tip:0:8}, whose CI run deploys it."
          fi

  deploy:
    needs: current
    # `workflow_run` fires for failed runs too — that is the point of the
    # gate, so check the conclusion.
    #
    # And check what CI ran on. CI also runs for pull requests, and
    # `branches: [main]` matches the head branch name, so a fork's PR from a
    # branch called `main` that passed CI would deploy the fork's commit with
    # the production secrets. Only a push to this repository ships.
    #
    # `always()` because `current` is skipped for a manual dispatch, which
    # ships whatever it was pointed at.
    if: >-
      always() && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.current.outputs.latest == 'true'))
    runs-on: ubuntu-latest
    # Attach a GitHub Environment to get required reviewers and to scope these
    # secrets to it.
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The exact commit CI approved, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The deploy talks to the server as root over SSH with BatchMode on, so
      # the key has to be in an agent before it runs — there is no prompt to
      # fall back to.
      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ts-cloud also reads the public key from disk to register it on the
      # server. An ssh-agent exposes no file path, so derive the public half
      # from the same private key instead of maintaining a second secret.
      - name: Write the deploy key to disk
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Deploy
        run: ./buddy deploy --${{ github.event.inputs.environment == 'staging' && 'staging' || github.event.inputs.environment == 'development' && 'dev' || 'prod' }} --yes
        env:
          # Decrypts .env.production. Without it the encrypted values silently
          # fall back to defaults, which is how an app deploys with the wrong
          # APP_KEY and invalidates every session it had.
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          #
          # Nothing else belongs here.
          #
          # Every other credential lives encrypted in .env.production and is
          # decrypted by the key above — one secret guarding all of them, and
          # the values reviewable in git rather than typed into a settings page.
          #
          # Naming one here does not merely duplicate it, it OVERRIDES it. A
          # repository secret that does not exist expands to an empty string,
          # GitHub sets the variable to "", and the env loader skips any key
          # already present in the environment — so the decrypted value never
          # wins. That is not hypothetical: PORKBUN_API_KEY, PORKBUN_SECRET_KEY
          # and CLOUDFLARE_API_TOKEN were all listed here against secrets that
          # were never created, and every deploy reported "no DNS provider
          # credentials found" while the real keys sat in .env.production the
          # whole time. DNS has not been reconciled on a deploy since.
          #
          # Add a credential with `buddy env:set KEY value --file .env.production`.

      # Ask the site whether the deploy worked, rather than trusting that the
      # deploy command exiting 0 means it did.
      #
      # `buddy deploy` reports success once a release is activated and the
      # services have been asked to restart. It cannot see a process that came
      # up against the previous release's env, a route that did not register,
      # or a page serving an older build of the views — all of which leave this
      # job green and the site wrong. The checks are in scripts/smoke.ts so
      # they can be run by hand against any environment:
      #
      #     bun scripts/smoke.ts https://wildloop.org
      #
      # Only production has a public URL today; staging and development deploy
      # to hosts this runner cannot name, so they skip rather than fail on a
      # URL that was never going to answer.
      - name: Smoke check the deployed site
        if: github.event.inputs.environment == '' || github.event.inputs.environment == 'production'
        run: bun scripts/smoke.ts https://wildloop.org
