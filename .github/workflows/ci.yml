name: CI

on:
  push:
    branches:
      - main

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun deps.yaml pins for pantry, which production runs too. This
          # was canary while the lockfile was format 2, which stable could not
          # read. It is format 1 now, and a canary runner tested a runtime
          # nothing ships on: its bun test killed the QA servers as dangling
          # and hung the dashboard, failures 1.4.2 and production do not have.
          bun-version: '1.4.2'

      # Reuse downloaded archives; materialize the dependency tree from this
      # lockfile so an older nested STX engine cannot survive a cache restore.
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-downloads-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx --bun pickier .

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun deps.yaml pins for pantry, which production runs too. This
          # was canary while the lockfile was format 2, which stable could not
          # read. It is format 1 now, and a canary runner tested a runtime
          # nothing ships on: its bun test killed the QA servers as dangling
          # and hung the dashboard, failures 1.4.2 and production do not have.
          bun-version: '1.4.2'

      # Reuse downloaded archives; materialize the dependency tree from this
      # lockfile so an older nested STX engine cannot survive a cache restore.
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-downloads-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun buddy test:types

      - name: Typecheck application
        run: bun run typecheck:app

  # Is the app actually portable to MySQL? Nothing else answers that: the test
  # suite never opens the configured database — it passes unchanged against a
  # database that does not exist — so running `bun test` under mysql would be a
  # green check that proves nothing.
  #
  # Migrating and seeding does exercise it, through the real ORM and the real
  # query builder. The corpus is generated here rather than committed, so it
  # cannot drift from the models the way a second checked-in corpus would.
  #
  # Non-blocking on purpose. As of 27 Oct 2026 this job FAILS, for three real
  # reasons worth tracking rather than hiding: the app stores timestamps as
  # ISO-8601 UTC strings and the generated MySQL schema types those columns
  # DATETIME, which rejects the trailing `Z`; the `user_notifications.read`
  # column is a MySQL reserved word the builder does not quote; and
  # `trails_fts` is a SQLite FTS5 virtual table with no MySQL equivalent.
  #
  # On the first of those: the `Z` is the entire blocker. MySQL accepts
  # `2026-10-27T11:40:12` and `2026-10-27 11:40:12` without complaint. Do NOT
  # "fix" it by dropping the `Z` — measured 27 Oct 2026, JS parses a
  # timezone-less datetime as LOCAL, so `new Date('2026-10-27T11:40:12')`
  # resolves to 03:40Z on this machine. Every timestamp in the app would move
  # by the host's UTC offset, and SQLite would go on storing the `Z` form, so
  # the codebase would hold two incompatible conventions at once.
  # The app is self-consistent here — 102 writes, 13 parsing reads, all
  # ISO-UTC. It is the column type that disagrees with it, so the fix belongs
  # in what the generator emits for a timestamp column, not in app code. When this goes green, the app is portable; until then it is a
  # progress meter, not a gate.
  mysql-portability:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wildloop_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_DATABASE: wildloop_mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Known broken as of stacks 0.75.328: this writes no files, while
      # `./buddy migrate` against the same empty MySQL still reports all 30
      # model tables missing. On 0.75.264 the identical command wrote 30. So
      # this job currently fails here rather than at the seeders, and the
      # timestamp fix from stacksjs/stacks#3014 that shipped in 0.75.328 has
      # not actually been exercised end to end yet.
      - name: Generate the MySQL migration corpus
        run: ./buddy generate:migrations --dialect mysql --no-interaction

      - name: Migrate
        run: ./buddy migrate --no-interaction

      # The seeders are the probe: they insert across most models through the
      # ORM, so a dialect difference surfaces as a failed seeder rather than a
      # silently empty table.
      - name: Seed, and fail if any seeder could not
        run: |
          ./buddy seed --no-interaction 2>&1 | tee seed.log
          if grep -qE "seeder\(s\) completed, [1-9]" seed.log; then
            echo "::error::A seeder failed under mysql — the app is not portable yet."
            grep -E "Application seeder .* failed" seed.log || true
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun deps.yaml pins for pantry, which production runs too. This
          # was canary while the lockfile was format 2, which stable could not
          # read. It is format 1 now, and a canary runner tested a runtime
          # nothing ships on: its bun test killed the QA servers as dangling
          # and hung the dashboard, failures 1.4.2 and production do not have.
          bun-version: '1.4.2'

      # Reuse downloaded archives; materialize the dependency tree from this
      # lockfile so an older nested STX engine cannot survive a cache restore.
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-downloads-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify map browser assets
        run: bun run gate:maps

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun test

  recording-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Production's Bun, as in the jobs above.
          bun-version: '1.4.2'
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      # Isolated test dependencies: no changes to the app's hoisted ORM tree.
      # Server-side regressions that need the QA app but no browser.
      #
      # The QA servers are started here, not by the tests. Left to the test
      # file, the canary bun test killed them as a dangling process after the
      # first describe block ("killed 1 dangling process"), and every dashboard
      # case then met a dead server: a 5 s timeout, ECONNRESET, ECONNREFUSED.
      # tests/browser/qa-servers.ts uses servers that already answer. They run
      # in their own process group, stopped whole afterwards, so the ports are
      # free again when the job moves on.
      - name: API and catalog regressions
        env:
          RECORDING_QA: '1'
        run: |
          setsid bun scripts/start-recording-qa.ts > "$RUNNER_TEMP/qa-servers.log" 2>&1 &
          qa=$!
          for _ in $(seq 1 180); do
            if curl -sf http://127.0.0.1:4321/api/health > /dev/null && curl -sf http://127.0.0.1:4332/api/json > /dev/null; then
              break
            fi
            sleep 1
          done
          # Ready means answering an app action promptly, not just /json. The
          # first one loads the whole app runtime, and the dashboard prewarms
          # its page render cache in the background, which on a two-core
          # runner kept its event loop busy for longer than a test's 5 s.
          start=$SECONDS
          for _ in $(seq 1 120); do
            if curl -sf -o /dev/null -m 1 http://127.0.0.1:4321/api/trails && curl -sf -o /dev/null -m 1 http://127.0.0.1:4332/api/trails; then
              break
            fi
            sleep 1
          done
          echo "QA servers answering app actions within 1 s after $((SECONDS - start)) s"
          status=0
          # --timeout: these suites share one rate-limit budget, and the
          # harness waits out a 429 once (tests/browser/qa-servers.ts). Only the
          # flag sets a timeout for every file; setDefaultTimeout from a shared
          # module reaches only the first file that imports it.
          bun test --timeout 75000 tests/browser || status=$?
          kill -- -"$qa" 2> /dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::QA server output"
            tail -n 200 "$RUNNER_TEMP/qa-servers.log"
            echo "::endgroup::"
          fi
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/api/health > /dev/null || break
            sleep 1
          done
          exit "$status"

  publish-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun deps.yaml pins for pantry, which production runs too. This
          # was canary while the lockfile was format 2, which stable could not
          # read. It is format 1 now, and a canary runner tested a runtime
          # nothing ships on: its bun test killed the QA servers as dangling
          # and hung the dashboard, failures 1.4.2 and production do not have.
          bun-version: '1.4.2'

      # Reuse downloaded archives; materialize the dependency tree from this
      # lockfile so an older nested STX engine cannot survive a cache restore.
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-downloads-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Commit builds go to the pantry registry, which is where this project
      # gets its dependencies and which ships `publish:commit` for exactly
      # this. The third-party service used here before refused the repo
      # outright — it skips private packages, and wildloop is
      # `"private": true` because it is an application rather than a library,
      # so it answered `400 {"message":"No packages"}` on every run.
      #
      # The installer action lives inside the pantry monorepo (packages/action)
      # and is not published as `pantry-pm/pantry-installer` yet, so the
      # release binary is fetched directly. Swap this step for the action once
      # that repo exists.
      - name: Install Pantry
        run: |
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/pantry.zip" \
            https://github.com/pantry-pm/pantry/releases/latest/download/pantry-linux-x64.zip
          # The archive holds a bare `pantry` binary, no wrapping directory.
          unzip -oq "$tmp/pantry.zip" -d "$tmp"
          sudo install -m 755 "$tmp/pantry" /usr/local/bin/pantry
          rm -rf "$tmp"
          pantry --version

      # `publish:commit` derives the version from the commit SHA itself, so
      # each build is separately installable without anyone stamping
      # package.json.
      #
      # A credential problem does not fail this job. That was already the rule
      # for a MISSING token — "a permanently red job teaches everyone to ignore
      # CI" — but the guard only covered absence, and the token configured here
      # is present and rejected. So the job failed on every commit, and because
      # Deploy is gated on CI's conclusion, an expired registry credential was
      # quietly blocking every deployment of the application.
      #
      # Publishing a commit build is not a correctness gate for the app: it is
      # a convenience for installing a specific SHA. It reports loudly and
      # moves on, so what gates a deploy stays limited to whether the code is
      # good.
      - name: Publish Commit
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          if [ -z "${PANTRY_TOKEN}" ]; then
            echo "PANTRY_TOKEN is not set — skipping the commit publish."
            echo "Add it to the repository secrets to publish this commit to the pantry registry."
            pantry publish:commit --dry-run --compact
            exit 0
          fi
          if ! pantry publish:commit --compact; then
            echo "::warning title=Commit publish failed::pantry publish:commit failed with the configured PANTRY_TOKEN. This commit is not installable from the registry; the build itself is unaffected. Rotate the token in repository secrets."
            exit 0
          fi
