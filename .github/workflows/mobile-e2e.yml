name: Mobile E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.maestro/**'
      - 'tests/native/**'
      - 'scripts/run-native-trail-e2e.ts'
      - 'app/**'
      - 'config/mobile.ts'
      # The app icon config/mobile.ts points at; a bad one fails the iOS build.
      - 'public/images/app/**'
      - 'bun.lock'
      - 'resources/**'
      - 'scripts/run-mobile-e2e.ts'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    paths:
      - '.maestro/**'
      - 'tests/native/**'
      - 'scripts/run-native-trail-e2e.ts'
      - 'app/**'
      - 'config/mobile.ts'
      # The app icon config/mobile.ts points at; a bad one fails the iOS build.
      - 'public/images/app/**'
      - 'bun.lock'
      - 'resources/**'
      - 'scripts/run-mobile-e2e.ts'
      - '.github/workflows/mobile-e2e.yml'

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
  MAESTRO_VERSION: cli-2.8.0

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
      - name: Install Maestro
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install iOS toolchain
        run: ./buddy setup:ios
      - name: Run iOS E2E flows
        run: bun scripts/run-mobile-e2e.ts ios
      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-e2e-ios
          path: storage/framework/runtime/e2e/ios
          if-no-files-found: warn

  android:
    env:
      ANDROID_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Android E2E app
        run: bun scripts/run-mobile-e2e.ts android --build-only
      - name: Run Android E2E flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          script: bun scripts/run-mobile-e2e.ts android --skip-build
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-e2e-android
          path: storage/framework/runtime/e2e/android
          if-no-files-found: warn

  native-trail-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      QA_PORT_BASE: '6320'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install iOS toolchain
        run: ./buddy setup:ios
      - name: Create owned trail QA simulator
        run: |
          bun -e '
            const { appendFileSync } = await import("node:fs");
            const list = JSON.parse(Bun.spawnSync(["xcrun", "simctl", "list", "devices", "available", "--json"]).stdout.toString());
            const candidates = Object.entries(list.devices).filter(([runtime]) => runtime.includes("iOS")).sort(([a], [b]) => b.localeCompare(a, undefined, { numeric: true }));
            const [runtime, devices] = candidates[0] ?? [];
            const model = devices?.find(device => device.name.startsWith("iPhone") && device.deviceTypeIdentifier);
            if (!model) throw new Error("No available iPhone simulator runtime");
            const created = Bun.spawnSync(["xcrun", "simctl", "create", "Wildloop Trail QA", model.deviceTypeIdentifier, runtime]);
            if (created.exitCode) throw new Error(created.stderr.toString());
            appendFileSync(process.env.GITHUB_ENV, `NATIVE_QA_DEVICE=${created.stdout.toString().trim()}\n`);
          '
      - name: Boot owned trail QA simulator
        run: |
          xcrun simctl boot "$NATIVE_QA_DEVICE"
          xcrun simctl bootstatus "$NATIVE_QA_DEVICE" -b
      - name: Test native maps, sticky saves and review lifecycle
        run: bun scripts/run-native-trail-e2e.ts
      - name: Release owned trail QA simulator
        if: always() && env.NATIVE_QA_DEVICE != ''
        run: |
          xcrun simctl shutdown "$NATIVE_QA_DEVICE" || true
          xcrun simctl delete "$NATIVE_QA_DEVICE"
      - name: Upload native trail evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-trail-ios
          path: |
            storage/framework/runtime/e2e/native-trail/*.log
            storage/framework/runtime/e2e/native-trail/*.txt
            storage/framework/runtime/e2e/native-trail/*.png
            storage/framework/runtime/e2e/native-trail/results.xcresult
          if-no-files-found: warn
