name: Native account regression

# Isolated development evidence; the normal CI and native app gates still run
# on the final candidate. This workflow stays on the temporary test branch.
on:
  push:
    branches: [codex/wildloop-account-regression]

permissions:
  contents: read

jobs:
  account-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen public dependencies
        run: bun install --frozen-lockfile
      - name: Run native account regressions
        run: bun test tests/unit/native-api.test.ts tests/unit/native-trail-detail-screen.test.ts tests/unit/native-record-screen.test.ts
