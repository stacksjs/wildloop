name: Tiles

# Rebuild the planet basemap behind https://tiles.wildloop.org.
#
# Weekly, so the map keeps up with OpenStreetMap the way the hosted basemaps it
# replaced did. The build runs on a server scripts/tiles/build-planet.ts rents
# for it, and nothing here waits on it: `launch` starts the build and returns,
# the server reports its progress to the bucket, and the hourly `check` deletes
# the server once it is done, failed or stuck. A build that takes ten hours on
# a slower machine is fine; no runner holds it open.
#
# Publishing is the server rewriting tiles.json, and only after the new archive
# is fully uploaded and checked, so a failed week leaves last week's map.
on:
  schedule:
    # Sunday 03:00 UTC: the quietest hour on the map, after the planet
    # mirrors' weekly refresh.
    - cron: '0 3 * * 0'
    # Hourly: finish whatever is in flight. A no-op with nothing running.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: launch a build, check the one in flight, or rehearse on the smallest server
        type: choice
        options: [launch, check, smoke]
        default: launch

concurrency:
  group: tiles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run
        env:
          # The one secret, as in deploy.yml: everything else (HCLOUD_TOKEN,
          # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) is decrypted from
          # .env.production with it.
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '0 3 * * 0' && 'launch') || 'check' }}
        run: bun scripts/tiles/build-planet.ts "$COMMAND"
