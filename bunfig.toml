# preload these modules before running bun
preload = [ "./storage/framework/defaults/resources/plugins/preloader.ts" ]

[test]
preload = [ "./tests/setup.ts" ]
coverage = false
# Framework tests that arrive with the vendored defaults (stacks 0.75) but only
# hold inside a stacks checkout. The VS Code extension's import `core/*` sources
# and @stacksjs/stx-vscode, neither of which an app has. DataExportAction's
# exports "the framework's own model declarations", which this app's models
# replace (and on CI its `db` has no `unsafe`).
pathIgnorePatterns = [
  "storage/framework/defaults/ide/vscode/**",
  "storage/framework/defaults/app/Actions/Auth/DataExportAction.test.ts",
]

[run]
# equivalent to `bun --bun` for all `bun run` commands
bun = true

[serve.static]
plugins = [ "bun-plugin-stx" ]

[install]
registry = { url = "https://registry.npmjs.org/", token = "$BUN_AUTH_TOKEN" }
linker = "hoisted"
